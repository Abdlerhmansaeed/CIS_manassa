<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Credentials Retrieved</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&amp;family=Be+Vietnam+Pro:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "surface-container-lowest": "#ffffff",
              "surface-container-low": "#fbf2e8",
              "on-tertiary-fixed-variant": "#004884",
              "on-secondary-container": "#6f6056",
              "inverse-primary": "#ffb4aa",
              "tertiary-container": "#0066b8",
              "on-surface-variant": "#5c403c",
              "secondary-container": "#f0dccf",
              "outline-variant": "#e5bdb8",
              "on-error-container": "#93000a",
              "on-error": "#ffffff",
              "surface-container-high": "#efe7dd",
              "surface-container": "#f5ede3",
              "primary-container": "#c8191a",
              "on-primary-fixed-variant": "#930009",
              "inverse-on-surface": "#f8f0e6",
              "primary-fixed": "#ffdad5",
              "on-background": "#1e1b15",
              "on-tertiary-container": "#d5e4ff",
              "inverse-surface": "#343029",
              "on-secondary": "#ffffff",
              "background": "#fff8f2",
              "on-tertiary-fixed": "#001c39",
              "on-primary-fixed": "#410002",
              "surface-dim": "#e0d9cf",
              "on-primary-container": "#ffdcd7",
              "tertiary-fixed-dim": "#a4c9ff",
              "surface-tint": "#be0e14",
              "on-tertiary": "#ffffff",
              "error-container": "#ffdad6",
              "surface-container-highest": "#e9e1d8",
              "secondary-fixed": "#f3dfd2",
              "outline": "#916f6b",
              "secondary-fixed-dim": "#d6c3b6",
              "surface-bright": "#fff8f2",
              "tertiary": "#004e8f",
              "primary-fixed-dim": "#ffb4aa",
              "on-primary": "#ffffff",
              "on-secondary-fixed": "#241912",
              "error": "#ba1a1a",
              "on-secondary-fixed-variant": "#52443b",
              "primary": "#a0000a",
              "surface": "#fff8f2",
              "surface-variant": "#e9e1d8",
              "on-surface": "#1e1b15",
              "secondary": "#6a5b51",
              "tertiary-fixed": "#d4e3ff"
            },
            fontFamily: {
              "headline": ["Plus Jakarta Sans"],
              "body": ["Be Vietnam Pro"],
              "label": ["Be Vietnam Pro"]
            },
            borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .bg-academic-mesh {
            background-color: #F5EDE3;
            background-image: radial-gradient(at 0% 0%, rgba(200, 25, 26, 0.03) 0px, transparent 50%),
                              radial-gradient(at 100% 100%, rgba(200, 25, 26, 0.03) 0px, transparent 50%);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-academic-mesh font-body text-on-surface min-h-screen flex flex-col items-center justify-center p-6 selection:bg-primary-container selection:text-on-primary-container">
<!-- Top Navigation Anchor -->
<header class="w-full top-0 sticky flex items-center justify-between px-6 py-4 bg-[#F5EDE3] dark:bg-stone-900 z-50">
<div class="flex items-center gap-4">
<button class="material-symbols-outlined text-red-700 dark:text-red-500 hover:bg-stone-200/50 dark:hover:bg-stone-800/50 transition-colors p-2 rounded-full active:scale-95 duration-200" data-icon="arrow_back">arrow_back</button>
<h1 class="text-lg font-bold text-stone-900 dark:text-stone-100 font-headline">Credentials</h1>
</div>
</header>
<main class="w-full max-w-md flex-1 flex flex-col items-center justify-center py-12">
<!-- Success Indicator -->
<div class="mb-8 flex flex-col items-center text-center">
<div class="w-24 h-24 bg-surface-container-highest rounded-full flex items-center justify-center mb-6 shadow-sm">
<span class="material-symbols-outlined text-green-600 text-6xl" data-icon="check_circle" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
<h2 class="font-headline text-3xl font-extrabold text-on-surface tracking-tight mb-3">Credentials Retrieved! 🎉</h2>
<p class="text-on-secondary-fixed-variant max-w-[280px] leading-relaxed">Save these details and log in to get started.</p>
</div>
<!-- Credentials Card -->
<div class="w-full bg-surface-container-lowest rounded-lg p-8 mb-10 shadow-[0_24px_48px_-12px_rgba(30,27,21,0.06)] flex flex-col gap-6 relative overflow-hidden">
<!-- Row 1: Student ID -->
<div class="flex items-center justify-between group">
<div class="flex flex-col gap-1">
<span class="text-[10px] font-bold tracking-[0.15em] text-on-secondary-fixed-variant uppercase">STUDENT ID</span>
<span class="text-2xl font-bold font-headline text-on-surface">2101234</span>
</div>
<button aria-label="Copy Student ID" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container-low text-secondary transition-all active:scale-90">
<span class="material-symbols-outlined text-[20px]" data-icon="content_copy">content_copy</span>
</button>
</div>
<!-- Visual Separation -->
<div class="h-px bg-surface-container-high w-full"></div>
<!-- Row 2: Password -->
<div class="flex items-center justify-between group">
<div class="flex flex-col gap-1">
<span class="text-[10px] font-bold tracking-[0.15em] text-on-secondary-fixed-variant uppercase">PASSWORD</span>
<span class="text-2xl font-bold font-headline text-on-surface tracking-widest">••••••••</span>
</div>
<div class="flex items-center gap-2">
<button aria-label="Toggle password visibility" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container-low text-secondary transition-all active:scale-90">
<span class="material-symbols-outlined text-[20px]" data-icon="visibility">visibility</span>
</button>
<button aria-label="Copy Password" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container-low text-secondary transition-all active:scale-90">
<span class="material-symbols-outlined text-[20px]" data-icon="content_copy">content_copy</span>
</button>
</div>
</div>
</div>
<!-- Action Section -->
<div class="w-full flex flex-col items-center gap-6">
<button class="w-full py-5 bg-primary-container text-on-primary font-bold rounded-full shadow-lg shadow-primary-container/20 hover:brightness-110 active:scale-[0.98] transition-all flex items-center justify-center gap-2 group">
                Go to Login 
                <span class="material-symbols-outlined group-hover:translate-x-1 transition-transform" data-icon="arrow_forward">arrow_forward</span>
</button>
<button class="text-on-secondary-fixed-variant text-sm font-medium hover:text-primary transition-colors flex items-center gap-1 active:scale-95">
<span class="material-symbols-outlined text-sm" data-icon="chevron_left">chevron_left</span>
                Go back
            </button>
</div>
</main>
<!-- Contextual Footer Decoration (Minimal) -->
<footer class="mt-auto py-8 text-center">
<p class="text-[10px] uppercase tracking-widest text-on-secondary-fixed-variant/40 font-bold">Academic Portal Secure Access</p>
</footer>
</body></html>
