<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Be+Vietnam+Pro:wght@300;400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              colors: {
                "on-primary-container": "#ffdcd7",
                "tertiary": "#004e8f",
                "inverse-surface": "#343029",
                "inverse-primary": "#ffb4aa",
                "secondary": "#6a5b51",
                "on-primary-fixed": "#410002",
                "surface": "#fff8f2",
                "secondary-fixed-dim": "#d6c3b6",
                "on-primary-fixed-variant": "#930009",
                "primary-fixed-dim": "#ffb4aa",
                "on-secondary-container": "#6f6056",
                "surface-variant": "#e9e1d8",
                "surface-container-high": "#efe7dd",
                "surface-bright": "#fff8f2",
                "on-surface-variant": "#5c403c",
                "surface-dim": "#e0d9cf",
                "on-tertiary-fixed-variant": "#004884",
                "outline": "#916f6b",
                "background": "#fff8f2",
                "outline-variant": "#e5bdb8",
                "on-background": "#1e1b15",
                "on-secondary-fixed-variant": "#52443b",
                "secondary-fixed": "#f3dfd2",
                "on-secondary": "#ffffff",
                "surface-container-low": "#fbf2e8",
                "tertiary-fixed-dim": "#a4c9ff",
                "error": "#ba1a1a",
                "surface-container-highest": "#e9e1d8",
                "on-error-container": "#93000a",
                "surface-container-lowest": "#ffffff",
                "surface-container": "#f5ede3",
                "on-secondary-fixed": "#241912",
                "on-tertiary-container": "#d5e4ff",
                "on-surface": "#1e1b15",
                "secondary-container": "#f0dccf",
                "primary-container": "#c8191a",
                "on-tertiary": "#ffffff",
                "error-container": "#ffdad6",
                "on-error": "#ffffff",
                "on-primary": "#ffffff",
                "on-tertiary-fixed": "#001c39",
                "primary-fixed": "#ffdad5",
                "inverse-on-surface": "#f8f0e6",
                "tertiary-fixed": "#d4e3ff",
                "primary": "#a0000a",
                "tertiary-container": "#0066b8",
                "surface-tint": "#be0e14"
              },
              fontFamily: {
                "headline": ["Plus Jakarta Sans"],
                "body": ["Be Vietnam Pro"],
                "label": ["Be Vietnam Pro"]
              },
              borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
            },
          },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glow-shadow {
            box-shadow: 0 10px 25px -5px rgba(200, 25, 26, 0.4);
        }
        .ambient-soft-shadow {
            box-shadow: 0 24px 48px -12px rgba(30, 27, 21, 0.08);
        }
        .qr-pattern {
            background-image: radial-gradient(#00000010 1px, transparent 1px);
            background-size: 16px 16px;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface font-body text-on-surface min-h-screen flex flex-col">
<!-- Login Container -->
<main class="flex-grow flex items-center justify-center px-6 py-12">
<div class="w-full max-w-md flex flex-col items-center">
<!-- Header Section -->
<div class="mb-10 text-center">
<div class="w-20 h-20 bg-primary-container rounded-full flex items-center justify-center mb-6 mx-auto ambient-soft-shadow">
<span class="material-symbols-outlined text-on-primary text-4xl" data-icon="school">school</span>
</div>
<h1 class="font-headline text-3xl font-extrabold tracking-tight text-on-surface mb-2">CIS Student Hub</h1>
<p class="text-on-surface-variant font-medium">Your academic life, simplified.</p>
</div>
<!-- Decorative QR Card -->
<div class="w-full h-32 mb-10 rounded-lg relative overflow-hidden bg-surface-container-highest flex items-center justify-center">
<!-- Blurred Blobs -->
<div class="absolute top-0 left-0 w-32 h-32 bg-primary/10 rounded-full blur-3xl -translate-x-1/2 -translate-y-1/2"></div>
<div class="absolute bottom-0 right-0 w-40 h-40 bg-secondary/10 rounded-full blur-3xl translate-x-1/4 translate-y-1/4"></div>
<!-- QR Grid Overlay -->
<div class="absolute inset-0 qr-pattern opacity-40"></div>
<!-- Visual Icon -->
<div class="relative z-10 flex flex-col items-center gap-1 opacity-60">
<span class="material-symbols-outlined text-3xl" data-icon="qr_code_2">qr_code_2</span>
<span class="text-[10px] uppercase tracking-[0.2em] font-bold">Secure Access Portal</span>
</div>
</div>
<!-- Form Fields -->
<form class="w-full space-y-6">
<!-- Student ID -->
<div class="space-y-2">
<label class="block text-sm font-semibold ml-4 text-on-surface-variant">Student ID</label>
<div class="relative">
<div class="absolute inset-y-0 left-5 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant text-xl" data-icon="person">person</span>
</div>
<input class="w-full py-4 pl-14 pr-6 bg-surface-container-lowest border-none rounded-full ambient-soft-shadow focus:ring-2 focus:ring-primary/20 text-on-surface placeholder:text-outline/60 transition-all font-medium" placeholder="Enter your student code" type="text"/>
</div>
</div>
<!-- Password -->
<div class="space-y-2">
<label class="block text-sm font-semibold ml-4 text-on-surface-variant">Password</label>
<div class="relative">
<div class="absolute inset-y-0 left-5 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant text-xl" data-icon="lock">lock</span>
</div>
<input class="w-full py-4 pl-14 pr-14 bg-surface-container-lowest border-none rounded-full ambient-soft-shadow focus:ring-2 focus:ring-primary/20 text-on-surface transition-all font-medium" type="password" value="••••••••"/>
<button class="absolute inset-y-0 right-5 flex items-center text-on-surface-variant hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined text-xl" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<!-- Actions Row -->
<div class="flex items-center justify-between px-2">
<label class="flex items-center cursor-pointer group">
<div class="relative">
<input class="sr-only peer" type="checkbox"/>
<div class="w-10 h-5 bg-surface-container-highest rounded-full peer peer-checked:bg-primary/20 transition-colors"></div>
<div class="absolute left-1 top-1 w-3 h-3 bg-on-surface-variant rounded-full transition-transform peer-checked:translate-x-5 peer-checked:bg-primary"></div>
</div>
<span class="ml-3 text-sm font-medium text-on-surface-variant group-hover:text-on-surface transition-colors">Remember Me</span>
</label>
<a class="text-sm font-bold text-primary hover:text-primary/80 transition-colors" href="#">Forgot Password?</a>
</div>
<!-- Sign In Button -->
<button class="w-full bg-primary-container text-on-primary font-headline font-bold py-4 rounded-full glow-shadow hover:scale-[1.02] active:scale-95 transition-all duration-200 mt-4 flex items-center justify-center gap-2" type="submit">
                    Sign In
                    <span class="material-symbols-outlined text-lg" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>
<!-- Registration Link -->
<div class="mt-12 text-center">
<p class="text-on-surface-variant font-medium">
                    Don't have an account? 
                    <a class="text-primary font-bold ml-1 hover:underline underline-offset-4" href="#">Request access</a>
</p>
</div>
</div>
</main>
<!-- Footer from Shared Components -->
<footer class="bg-surface-container py-8 mt-auto w-full">
<div class="max-w-7xl mx-auto flex flex-col items-center gap-4 text-center px-8">
<div class="flex flex-wrap justify-center gap-6 mb-2">
<a class="text-[10px] uppercase tracking-widest font-body text-stone-500 hover:text-red-600 transition-colors opacity-80 hover:opacity-100" href="#">Privacy Policy</a>
<a class="text-[10px] uppercase tracking-widest font-body text-stone-500 hover:text-red-600 transition-colors opacity-80 hover:opacity-100" href="#">Terms of Service</a>
<a class="text-[10px] uppercase tracking-widest font-body text-stone-500 hover:text-red-600 transition-colors opacity-80 hover:opacity-100" href="#">Help Desk</a>
</div>
<p class="text-[10px] uppercase tracking-widest font-body text-stone-500 opacity-80">© 2024 Center for Institutional Studies. All rights reserved.</p>
</div>
</footer>
</body></html>
